syntax = "proto3";

package aggregate.v1;

option go_package = "/;aggregate";

// 数据包：使用连续 PBPoints payload，避免尾采样链路重复解码/编码。
message DataPacket {
  uint64 group_id_hash = 1;
  string raw_group_id  = 2;
  string token         = 3;
  string source        = 4;
  string data_type     = 5;

  int64 config_version = 6;
  bool has_error       = 7;

  string group_key     = 8;
  int32 point_count    = 9;

  int64 trace_start_time_unix_nano = 10;
  int64 trace_end_time_unix_nano  = 11;

  bytes points_payload = 12;
  int64 max_point_time_unix_nano = 13;

  // points_payload 的压缩方式：0=未压缩（PBPoints 原始编码），1=zstd。
  // 兼容性：旧数据/旧版本读取方将按 0 处理。
  int32 payload_compression = 14;

  // ---- 已见 span 谓词摘要（跨 Datakit 由 dataway Ingest 合并路径 OR 聚合）----
  // 语义：本 DataPacket 组包时已见 span 的特征摘要，供 dataway 决策时免解压评估；
  // 仅统计"已见"数据，跨 Datakit 合并后即为所有已见 Datakit 的并集。

  bool pred_error = 15; // 任一已见 span: status="error"
  bool pred_http_error = 16; // 任一已见 span: http_status_code 匹配 4xx/5xx
  bool pred_biz_error = 17; // 任一已见 span: body_code 业务错误（非 "0"/"200"）
  bool pred_trace_keep = 18; // 任一已见 span: trace_keep=true

  int64 max_span_duration_us = 19; // 已见 span 最大 duration（微秒）
  int64 root_duration_us = 20; // 已见 root span（parent_id="0"）的 duration（微秒，0=未见）
  int64 max_nonroot_duration_us = 21; // 已见非 root span 最大 duration（微秒）
}

// batch packages
message DataBatch {
  string collector_id = 1;
  repeated DataPacket packets = 2;
}
